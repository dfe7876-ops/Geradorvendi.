          root: spanRef.current,

      textArea.focus();

    // Cálculo CRC16-CCITT (0xFFFF) oficial do padrão Pix BACEN
    function crc16CCITT(payload) {
      let crc = 0xffff;
      for (let i = 0; i < payload.length; i++) {
        crc ^= payload.charCodeAt(i) << 8;
        for (let j = 0; j < 8; j++) {
          if ((crc & 0x8000) !== 0) {
            crc = (crc << 1) ^ 0x1021;
          } else {
            crc = crc << 1;
          }
        }
      }
      return (crc & 0xffff).toString(16).toUpperCase().padStart(4, '0');
    }

    // Gera uma string EMV Pix Copia e Cola realista
    function generatePixEMV({ amount, txid, merchantName = 'VINDI PAGAMENTOS SA', city = 'SAO PAULO' }) {
      const formatField = (id, val) => {
        const str = String(val);
        const len = str.length.toString().padStart(2, '0');
        return `${id}${len}${str}`;
      };

      const cleanAmount = Number(amount).toFixed(2);
      const gui = formatField('00', 'br.gov.bcb.pix');
      const url = formatField('25', `pix.vindi.com.br/qr/v2/${txid.toLowerCase()}`);
      const merchantAccount = formatField('26', gui + url);

      const payloadWithoutCRC = [
        formatField('00', '01'),
        formatField('01', '12'),
        merchantAccount,
        formatField('52', '0000'),
        formatField('53', '986'),
        formatField('54', cleanAmount),
        formatField('58', 'BR'),
        formatField('59', merchantName.substring(0, 25)),
        formatField('60', city.substring(0, 15)),
        formatField('62', formatField('05', txid.substring(0, 25))),
        '6304'
      ].join('');

      return payloadWithoutCRC + crc16CCITT(payloadWithoutCRC);
    }

    // Componente visual de QR Code determinístico baseado no payload Pix
    const PixQRCodeSVG = ({ value, size = 210 }) => {
      const matrix = useMemo(() => {
        const gridSize = 29;
        const grid = Array.from({ length: gridSize }, () => Array(gridSize).fill(false));

        const drawFinder = (r, c) => {
          for (let i = -1; i <= 7; i++) {
            for (let j = -1; j <= 7; j++) {
              const nr = r + i;
              const nc = c + j;
              if (nr >= 0 && nr < gridSize && nc >= 0 && nc < gridSize) {
                if (i === -1 || i === 7 || j === -1 || j === 7) {
                  grid[nr][nc] = false;
                } else if (i === 0 || i === 6 || j === 0 || j === 6 || (i >= 2 && i <= 4 && j >= 2 && j <= 4)) {
                  grid[nr][nc] = true;
                } else {
                  grid[nr][nc] = false;
                }
              }
            }
          }
        };

        drawFinder(0, 0);
        drawFinder(0, gridSize - 7);
        drawFinder(gridSize - 7, 0);

        for (let i = 8; i < gridSize - 8; i++) {
          grid[6][i] = i % 2 === 0;
          grid[i][6] = i % 2 === 0;
        }

        let hash = 2166136261;
        for (let i = 0; i < value.length; i++) {
          hash ^= value.charCodeAt(i);
          hash = Math.imul(hash, 16777619);
        }

        for (let r = 0; r < gridSize; r++) {
          for (let c = 0; c < gridSize; c++) {
            const inTopLeft = r < 8 && c < 8;
            const inTopRight = r < 8 && c >= gridSize - 8;
            const inBottomLeft = r >= gridSize - 8 && c < 8;
            const inCenterLogo = r >= 11 && r <= 17 && c >= 11 && c <= 17;
            if (inTopLeft || inTopRight || inBottomLeft || r === 6 || c === 6 || inCenterLogo) continue;

            const charCode = value.charCodeAt((r * gridSize + c) % value.length) || 65;
            const bit = ((hash ^ (charCode * (r + 1) * (c + 3))) >>> ((r + c) % 16)) & 1;
            grid[r][c] = bit === 1;
          }
        }

        return grid;
      }, [value]);

      const cellSize = size / matrix.length;

      return (
        <div className="relative inline-flex items-center justify-center p-4 bg-white rounded-2xl shadow-sm border border-slate-200">
          <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} className="block">
            <rect width={size} height={size} fill="#FFFFFF" />
            {matrix.map((row, rIdx) =>
              row.map((cell, cIdx) =>
                cell ? (
                  <rect
                    key={`${rIdx}-${cIdx}`}
                    x={cIdx * cellSize}
                    y={rIdx * cellSize}
                    width={cellSize + 0.2}
                    height={cellSize + 0.2}
                    rx={cellSize * 0.22}
                    fill="#0F172A"
                  />
                ) : null
              )
            )}
          </svg>
          <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
            <div className="w-11 h-11 rounded-xl bg-teal-600 text-white flex items-center justify-center shadow-md border-2 border-white">
              <QrCode className="w-6 h-6" />
            </div>
          </div>
        </div>
      );
    };

      const executeVindiRequest = async (method, path, body) => {
        if (apiMode === 'live' && apiKey.trim()) {
          try {
            const encodedKey = btoa(`${apiKey.trim()}:`);
            const response = await fetch(`${apiEnvironment}${path}`, {
              method,
              headers: {
                'Content-Type': 'application/json',
                Authorization: `Basic ${encodedKey}`
              },
              body: body ? JSON.stringify(body) : undefined
            });
            const data = await response.json();
            addApiLog('API_LIVE', method, path, response.status, data);
            if (!response.ok) {
              throw new Error(data?.errors?.[0]?.message || `Erro HTTP ${response.status}`);
            }
            return { liveSuccess: true, data };
          } catch (err) {
            addApiLog('API_ERROR', method, path, 0, {
              error: err.message,
              note: 'Bloqueio de CORS no navegador ou chave inválida. Executando fallback local.'
            });
            showToast(`Aviso API Real: ${err.message} (registrado localmente)`, 'warning');
            return { liveSuccess: false };
          }
        }
        return { liveSuccess: false };

      // ======================================================================
      // AÇÕES: COBRANÇAS PIX (BILLS) & CÁLCULO DE SPLIT
      // ======================================================================

      const pixFormTotal = useMemo(() => {
        return pixForm.items.reduce((acc, item) => {
          const prod = products.find((p) => p.id === Number(item.productId));
          const price = prod ? prod.pricing_schema.price : 0;
          return acc + price * (Number(item.quantity) || 1);
        }, 0);
      }, [pixForm.items, products]);

      const computedSplitSummary = useMemo(() => {
        if (!pixForm.splitEnabled || pixFormTotal <= 0) {
          return {
            rows: [],
            totalAllocated: pixFormTotal,
            remaining: 0,
            isValid: true
          };
        }

        let totalAllocated = 0;
        const rows = pixForm.splits.map((rule) => {
          const rec = recipients.find((r) => r.id === rule.recipientId) || recipients[0];
          const numericVal = Math.max(0, Number(rule.value) || 0);
          const calculatedAmount =
            rule.mode === 'percentage'
              ? Number(((pixFormTotal * numericVal) / 100).toFixed(2))
              : Number(numericVal.toFixed(2));

          totalAllocated = Number((totalAllocated + calculatedAmount).toFixed(2));
          const effectivePct =
            pixFormTotal > 0 ? Number(((calculatedAmount / pixFormTotal) * 100).toFixed(2)) : 0;

          return {
            ...rule,
            recipientName: rec ? rec.name : 'Recebedor',
            recipientKey: rec ? rec.pix_key : '',
            vindiAccountId: rec ? rec.vindi_account_id : '',
            calculatedAmount,
            effectivePct
          };
        });

        const remaining = Number((pixFormTotal - totalAllocated).toFixed(2));
        const isValid = Math.abs(remaining) <= 0.05 && rows.length > 0;

        return {
          rows,
          totalAllocated,
          remaining,
          isValid
        };
      }, [pixForm.splitEnabled, pixForm.splits, pixFormTotal, recipients]);

      const handleApplyProductSplitRules = () => {
        if (pixFormTotal <= 0) return;
        const accumulator = {};

        pixForm.items.forEach((item) => {
          const prod = products.find((p) => p.id === Number(item.productId));
          if (!prod) return;
          const itemTotal = prod.pricing_schema.price * (Number(item.quantity) || 1);
          const prodSplits =
            prod.default_splits && prod.default_splits.length > 0
              ? prod.default_splits
              : [{ recipient_id: recipients[0]?.id || 'rec_01', mode: 'percentage', value: 100 }];

          prodSplits.forEach((sp) => {
            const share = (itemTotal * (Number(sp.value) || 0)) / 100;
            accumulator[sp.recipient_id] = (accumulator[sp.recipient_id] || 0) + share;
          });
        });

        const entries = Object.entries(accumulator);
        if (entries.length === 0) return;

        let sumPct = 0;
        const nextSplits = entries.map(([recipientId, amount], idx) => {
          let pct = Number(((amount / pixFormTotal) * 100).toFixed(2));
          if (idx === entries.length - 1) {
            pct = Number((100 - sumPct).toFixed(2));
          } else {
            sumPct += pct;
          }
          return {
            recipientId,
            mode: 'percentage',
            value: pct
          };
        });

        setPixForm((prev) => ({
          ...prev,
          splitEnabled: true,
          splits: nextSplits
        }));
        showToast('Divisão calculada automaticamente conforme os produtos da fatura!');
      };

      const handleAddSplitRule = () => {
        const unused = recipients.find((r) => !pixForm.splits.some((s) => s.recipientId === r.id));
        const targetRec = unused || recipients[0];
        if (!targetRec) return;

        const remPct =
          pixFormTotal > 0
            ? Math.max(0, Number(((computedSplitSummary.remaining / pixFormTotal) * 100).toFixed(2)))
            : 0;

        setPixForm((prev) => ({
          ...prev,
          splits: [
            ...prev.splits,
            {
              recipientId: targetRec.id,
              mode: 'percentage',
              value: remPct
            }
          ]
        }));
      };

      const handleRemoveSplitRule = (idx) => {
        if (pixForm.splits.length <= 1) return;
        setPixForm((prev) => ({
          ...prev,
          splits: prev.splits.filter((_, i) => i !== idx)
        }));
      };

      const handleUpdateSplitRule = (idx, field, value) => {
        setPixForm((prev) => ({
          ...prev,
          splits: prev.splits.map((s, i) => (i === idx ? { ...s, [field]: value } : s))
        }));
      };

      const handleAddPixItem = () => {
        const activeProds = products.filter((p) => p.status === 'active');
        const defaultProd = activeProds[0] || products[0];
        if (!defaultProd) return;
        setPixForm((prev) => ({
          ...prev,
          items: [...prev.items, { productId: defaultProd.id, quantity: 1 }]
        }));
      };

      const handleRemovePixItem = (idx) => {
        if (pixForm.items.length <= 1) return;
        setPixForm((prev) => ({
          ...prev,
          items: prev.items.filter((_, i) => i !== idx)
        }));
      };

      const handleUpdatePixItem = (idx, field, value) => {

          ...prev,
          items: prev.items.map((item, i) => (i === idx ? { ...item, [field]: value } : item))
        }));

      const handleCreatePixCharge = async (e) => {
        e.preventDefault();
        if (pixFormTotal <= 0) {
          showToast('Adicione pelo menos um produto válido à cobrança.', 'warning');
          return;
        }

        if (pixForm.splitEnabled && !computedSplitSummary.isValid) {
          showToast(
            `A divisão do Split precisa fechar 100% do valor (${formatCurrency(pixFormTotal)}). Diferença atual: ${formatCurrency(computedSplitSummary.remaining)}.`,
            'warning'
          );
          return;
        }

        setIsSubmitting(true);
        const customer = customers.find((c) => c.id === Number(pixForm.customerId)) || customers[0];

        const resolvedItems = pixForm.items.map((item, index) => {
          const prod = products.find((p) => p.id === Number(item.productId));
          const qty = Math.max(1, Number(item.quantity) || 1);
          const unitPrice = prod ? prod.pricing_schema.price : 0;
          return {
            id: Date.now() + index,
            product_id: prod.id,
            product_name: prod.name,
            quantity: qty,
            unit_price: unitPrice,
            amount: unitPrice * qty
          };
        });

        const billId = Math.floor(774200 + Math.random() * 8000);
        const txid = `VINDIPX${Date.now().toString().slice(-10)}`;
        const paymentMethodCode = pixForm.pixType === 'pix_automatico' ? 'pix_automatic' : 'pix';
        const dueAt = new Date(Date.now() + Number(pixForm.dueHours) * 3600000).toISOString();

        const resolvedSplits = pixForm.splitEnabled
          ? computedSplitSummary.rows.map((r) => ({
              recipient_id: r.recipientId,
              recipient_name: r.recipientName,
              vindi_account_id: r.vindiAccountId,
              mode: r.mode,
              value: Number(r.value),
              calculated_amount: r.calculatedAmount
            }))
          : [];

        const vindiBillPayload = {
          customer_id: customer.id,
          payment_method_code: paymentMethodCode,
          due_at: dueAt,
          bill_items: resolvedItems.map((it) => ({
            product_id: it.product_id,
            amount: it.amount,
            quantity: it.quantity
          })),
          ...(pixForm.splitEnabled && {
            split_rules: resolvedSplits.map((sp) => ({
              recipient_account_id: sp.vindi_account_id,
              amount: sp.calculated_amount,
              percentage:
                pixFormTotal > 0 ? Number(((sp.calculated_amount / pixFormTotal) * 100).toFixed(2)) : 0
            }))
          })
        };

        await executeVindiRequest('POST', '/bills', vindiBillPayload);

        const pixEmv = generatePixEMV({
          amount: pixFormTotal,
          txid
        });

        const newBill = {
          id: billId,
          code: `BILL-${billId}`,
          amount: pixFormTotal,
          status: 'pending',
          payment_method_code: paymentMethodCode,
          pix_type: pixForm.pixType,
          customer,
          bill_items: resolvedItems,
          due_at: dueAt,
          created_at: new Date().toISOString(),
          pix_qr_code: pixEmv,
          txid,
          split_enabled: pixForm.splitEnabled,
          split_rules: resolvedSplits
        };

        setBills((prev) => [newBill, ...prev]);
        addApiLog('REST_V1', 'POST', '/v1/bills', 201, {
          bill: {
            id: newBill.id,
            status: 'pending',
            amount: newBill.amount.toFixed(2),
            payment_method: { code: paymentMethodCode },
            split_rules: resolvedSplits,
            charges: [
              {
                status: 'pending',
                last_transaction: {
                  gateway_response_fields: {
                    qrcode_original_path: `https://pix.vindi.com.br/qr/${txid}`,
                    emv_payload: pixEmv
                  }
                }
              }
            ]
          }
        });

        setIsSubmitting(false);
        setSelectedBillForQR(newBill);
        showToast(
          pixForm.splitEnabled
            ? `Cobrança Pix gerada com Split entre ${resolvedSplits.length} recebedor(es)!`
            : 'Cobrança Pix gerada! QR Code pronto para pagamento.'
        );
      };

      const handleSimulatePixPayment = (billId) => {
        const paidAt = new Date().toISOString();
        let updatedBill = null;

        setBills((prev) =>
          prev.map((b) => {
            if (b.id !== billId) return b;
            updatedBill = { ...b, status: 'paid', paid_at: paidAt };
            return updatedBill;
          })
        );

        if (selectedBillForQR && selectedBillForQR.id === billId) {

        if (updatedBill) {
          addApiLog('WEBHOOK', 'POST', '/webhooks/vindi (event: bill_paid)', 200, {

              type: 'bill_paid',

                bill: {

      const handleCancelBill = (billId) => {

          prev.map((b) => (b.id === billId ? { ...b, status: 'canceled' } : b))

      const handleResetDemoData = () => {
        localStorage.removeItem('vindi_gh_products');
        localStorage.removeItem('vindi_gh_recipients');

      // ======================================================================
      // MÉTRICAS DO DASHBOARD
      // ======================================================================

      const metrics = useMemo(() => {
        const paidBills = bills.filter((b) => b.status === 'paid');
        const pendingBills = bills.filter((b) => b.status === 'pending');
        const validBills = bills.filter((b) => b.status !== 'canceled');

        const totalPaid = paidBills.reduce((sum, b) => sum + b.amount, 0);
        const totalPending = pendingBills.reduce((sum, b) => sum + b.amount, 0);
        const conversionRate =
          validBills.length > 0 ? Math.round((paidBills.length / validBills.length) * 100) : 0;
        const activeProductsCount = products.filter((p) => p.status === 'active').length;

        return {
          totalPaid,
          paidCount: paidBills.length,
          totalPending,
          pendingCount: pendingBills.length,
          conversionRate,
          activeProductsCount,
          totalProductsCount: products.length
        };
      }, [bills, products]);

      const recipientBalances = useMemo(() => {
        const map = {};
        recipients.forEach((r) => {
          map[r.id] = { paid: 0, pending: 0, count: 0 };
        });

        bills.forEach((b) => {
          if (b.status === 'canceled') return;
          if (b.split_enabled && b.split_rules && b.split_rules.length > 0) {
            b.split_rules.forEach((rule) => {
              if (!map[rule.recipient_id]) {
                map[rule.recipient_id] = { paid: 0, pending: 0, count: 0 };
              }
              if (b.status === 'paid') {
                map[rule.recipient_id].paid += rule.calculated_amount;
              } else if (b.status === 'pending') {
                map[rule.recipient_id].pending += rule.calculated_amount;
              }
              map[rule.recipient_id].count += 1;
            });
          } else {
            const mainId = recipients[0]?.id || 'rec_01';
            if (!map[mainId]) map[mainId] = { paid: 0, pending: 0, count: 0 };
            if (b.status === 'paid') map[mainId].paid += b.amount;
            if (b.status === 'pending') map[mainId].pending += b.amount;
            map[mainId].count += 1;
          }
        });

        return map;
      }, [bills, recipients]);

      const filteredProducts = useMemo(() => {
        return products.filter(
          (p) =>
            p.name.toLowerCase().includes(productSearch.toLowerCase()) ||
            p.code.toLowerCase().includes(productSearch.toLowerCase())
        );
      }, [products, productSearch]);

      const filteredBills = useMemo(() => {
        if (billFilter === 'all') return bills;
        return bills.filter((b) => b.status === billFilter);
      }, [bills, billFilter]);

      const renderStatusBadge = (status) => {
        switch (status) {
          case 'paid':
            return (
              <span className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200">
                <CheckCircle2 className="w-3.5 h-3.5 text-emerald-600" />
                Paga (Pix Liquidado)
              </span>
            );

                      Domicílio Bancário & Conta Vindi (Opcional)
                    </span>
                    <div className="grid grid-cols-3 gap-2">
                      <input
                        type="text"
                        placeholder="Banco (ex: Itaú)"
                        value={newRecipient.bank_name}
                        onChange={(e) => setNewRecipient({ ...newRecipient, bank_name: e.target.value })}
                        className="rounded-xl border border-slate-300 bg-white px-3 py-2 text-xs"
                      />
                      <input
                        type="text"
                        placeholder="Agência"
                        value={newRecipient.bank_agency}
                        onChange={(e) =>
                          setNewRecipient({ ...newRecipient, bank_agency: e.target.value })
                        }
                        className="rounded-xl border border-slate-300 bg-white px-3 py-2 text-xs font-mono"
                      />
                      <input
                        type="text"
                        placeholder="Conta c/ dígito"
                        value={newRecipient.bank_account}
                        onChange={(e) =>
                          setNewRecipient({ ...newRecipient, bank_account: e.target.value })
                        }
                        className="rounded-xl border border-slate-300 bg-white px-3 py-2 text-xs font-mono"
                      />
                    </div>
                    <input
                      type="text"
                      placeholder="ID da Conta Vindi (gerado automaticamente se vazio)"
                      value={newRecipient.vindi_account_id}
                      onChange={(e) =>
                        setNewRecipient({ ...newRecipient, vindi_account_id: e.target.value })
                      }
                      className="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-xs font-mono"
                    />
                  </div>

                  <div className="pt-2 flex justify-end gap-2">
                    <button
                      type="button"
                      onClick={() => {
                        setIsRecipientModalOpen(false);
                        setEditingRecipientId(null);
                      }}
                      className="px-4 py-2.5 rounded-xl text-xs font-semibold text-slate-600 hover:bg-slate-100"
                    >
                      Cancelar
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2.5 rounded-xl text-xs font-bold bg-indigo-600 hover:bg-indigo-700 text-white shadow-sm"
                    >
                      {editingRecipientId ? 'Salvar Alterações' : 'Cadastrar Recebedor'}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ================================================================
              MODAL 3: CADASTRAR NOVO CLIENTE
          ================================================================ */}
          {isCustomerModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-md w-full shadow-2xl border border-slate-200 overflow-hidden">
                <div className="p-5 border-b border-slate-200 flex items-center justify-between">
                  <h3 className="font-bold text-sm text-slate-900">Novo Cliente Vindi</h3>
                  <button
                    onClick={() => setIsCustomerModalOpen(false)}
                    className="p-1.5 rounded-lg text-slate-400 hover:text-slate-700"
                  >
                    <X className="w-5 h-5" />
                  </button>
                </div>

                <form onSubmit={handleCreateCustomer} className="p-6 space-y-4">
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">
                      Nome Completo / Razão Social *
                    </label>
                    <input
                      type="text"
                      required
                      placeholder="Ex: Empresa Exemplo Ltda"
                      value={newCustomer.name}
                      onChange={(e) => setNewCustomer({ ...newCustomer, name: e.target.value })}
                      className="w-full rounded-xl border border-slate-300 px-3.5 py-2.5 text-sm"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">
                      E-mail Financeiro *
                    </label>
                    <input
                      type="email"
                      required
                      placeholder="financeiro@empresa.com.br"
                      value={newCustomer.email}
                      onChange={(e) => setNewCustomer({ ...newCustomer, email: e.target.value })}
                      className="w-full rounded-xl border border-slate-300 px-3.5 py-2.5 text-sm"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">
                      CPF ou CNPJ
                    </label>
                    <input
                      type="text"
                      placeholder="00.000.000/0001-00"
                      value={newCustomer.registry_code}
                      onChange={(e) =>
                        setNewCustomer({ ...newCustomer, registry_code: e.target.value })
                      }
                      className="w-full rounded-xl border border-slate-300 px-3.5 py-2.5 text-sm font-mono"
                    />
                  </div>

                  <div className="pt-2 flex justify-end gap-2">
                    <button
                      type="button"
                      onClick={() => setIsCustomerModalOpen(false)}
                      className="px-4 py-2.5 rounded-xl text-xs font-semibold text-slate-600 hover:bg-slate-100"
                    >
                      Cancelar
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2.5 rounded-xl text-xs font-bold bg-teal-600 hover:bg-teal-700 text-white"
                    >
                      Cadastrar Cliente
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ================================================================
              MODAL 4: CONFIGURAÇÕES DA API VINDI (SANDBOX / LIVE)
          ================================================================ */}
          {isConfigOpen && (
            <div className="fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-lg w-full shadow-2xl border border-slate-200 overflow-hidden">
                <div className="p-5 border-b border-slate-200 flex items-center justify-between">
                  <div className="flex items-center gap-2.5">
                    <ShieldCheck className="w-5 h-5 text-teal-600" />
                    <h3 className="font-bold text-sm text-slate-900">
                      Integração API REST v1 — Vindi
                    </h3>
                  </div>
                  <button
                    onClick={() => setIsConfigOpen(false)}
                    className="p-1.5 rounded-lg text-slate-400 hover:text-slate-700"
                  >
                    <X className="w-5 h-5" />
                  </button>
                </div>

                <div className="p-6 space-y-4">
                  <div className="grid grid-cols-2 gap-3">
                    <button
                      type="button"
                      onClick={() => setApiMode('sandbox')}
                      className={`p-3.5 rounded-2xl border text-left transition ${
                        apiMode === 'sandbox'
                          ? 'border-teal-600 bg-teal-50/70 text-teal-950'
                          : 'border-slate-200 text-slate-600'
                      }`}
                    >
                      <div className="text-xs font-bold">Sandbox Local (Recomendado)</div>
                      <div className="text-[11px] opacity-80 mt-1">
                        Ideal para GitHub Pages: gera QR Codes Pix, salva no navegador e simula webhooks.
                      </div>
                    </button>

                    <button
                      type="button"
                      onClick={() => setApiMode('live')}
                      className={`p-3.5 rounded-2xl border text-left transition ${
                        apiMode === 'live'
                          ? 'border-teal-600 bg-teal-50/70 text-teal-950'
                          : 'border-slate-200 text-slate-600'
                      }`}
                    >
                      <div className="text-xs font-bold">API Vindi Real (REST v1)</div>
                      <div className="text-[11px] opacity-80 mt-1">
                        Envia chamadas autenticadas com sua API Key da Vindi.
                      </div>
                    </button>
                  </div>

                  {apiMode === 'live' && (
                    <div className="space-y-3 pt-2">
                      <div>
                        <label className="block text-xs font-semibold text-slate-700 mb-1">
                          Ambiente Vindi
                        </label>
                        <select
                          value={apiEnvironment}
                          onChange={(e) => setApiEnvironment(e.target.value)}
                          className="w-full rounded-xl border border-slate-300 bg-white px-3.5 py-2 text-xs font-mono"
                        >
                          <option value="https://sandbox-app.vindi.com.br/api/v1">
                            Sandbox (https://sandbox-app.vindi.com.br/api/v1)
                          </option>
                          <option value="https://app.vindi.com.br/api/v1">
                            Produção (https://app.vindi.com.br/api/v1)
                          </option>
                        </select>
                      </div>

                      <div>
                        <label className="block text-xs font-semibold text-slate-700 mb-1">
                          Chave Privada da API (Vindi API Key)
                        </label>
                        <input
                          type="password"
                          placeholder="Cole sua chave secreta da Vindi..."
                          value={apiKey}
                          onChange={(e) => setApiKey(e.target.value)}
                          className="w-full rounded-xl border border-slate-300 px-3.5 py-2.5 text-xs font-mono"
                        />
                      </div>
                    </div>
                  )}

                  <div className="pt-2 flex justify-end">
                    <button
                      onClick={() => {
                        setIsConfigOpen(false);
                        showToast(
                          apiMode === 'live'
                            ? 'Configuração de API Real salva!'
                            : 'Modo Sandbox Local ativado!'
                        );
                      }}
                      className="px-5 py-2.5 rounded-xl bg-slate-900 text-white text-xs font-bold hover:bg-slate-800"
                    >
                      Concluir Configuração
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
